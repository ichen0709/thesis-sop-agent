[project]
name = "sop-agent"
version = "0.1.0"
description = "企管系研究生離校 SOP 問答 agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sop_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
